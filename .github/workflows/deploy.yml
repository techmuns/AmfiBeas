name: Deploy

# Deploys the app to Cloudflare Workers via OpenNext, always publishing the
# LATEST commit on `main` (checkout ref: main) so the live Worker never lags.
#   - push to `main` — human/code merges (PRs).
#   - workflow_run — after any data-refresh workflow COMPLETES. The daily NAV /
#     index / holdings / AMFI workflows commit with the automatic GITHUB_TOKEN,
#     and GitHub deliberately does NOT let a GITHUB_TOKEN push trigger another
#     workflow's `push` event — so without this chain those data commits landed
#     on main but were never deployed, leaving the dashboard on stale data. This
#     re-deploys main whenever one of them finishes.
#   - schedule — a daily backstop so anything the chain misses (a new/renamed
#     data workflow, a manual backfill) still goes live within a day.
#   - workflow_dispatch — redeploy current main on demand.
#
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   - CLOUDFLARE_API_TOKEN   — a token with "Edit Cloudflare Workers" permission
#   - CLOUDFLARE_ACCOUNT_ID  — the account that owns the `amfibeas` Worker
# wrangler (invoked by `opennextjs-cloudflare deploy`) reads both from the env.

on:
  push:
    branches: [main]
  workflow_run:
    workflows:
      - "NAV latest snapshot (daily)"
      - "NAV daily refresh (mf-data forward)"
      - "NAV history forward refresh (daily)"
      - "NIFTY 500 latest snapshot (daily)"
      - "NIFTY 500 history forward refresh (daily)"
      - "Schemewise holdings (monthly)"
      - "AMC monthly portfolio fetch"
      - "Shares outstanding (cap-flows %)"
      - "Ingest data"
    types: [completed]
  schedule:
    - cron: "30 3 * * *" # 03:30 UTC daily backstop
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you deploying manually?"
        required: false
        type: string

permissions:
  contents: read

# Never run two production deploys at once, and never cancel a deploy that is
# already in flight (cancelling mid-upload can leave a half-published Worker).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    # No trigger gating on purpose. This job always checks out `main` and
    # publishes whatever is there, so deploying after a FAILED data refresh is
    # harmless (nothing was committed — it just republishes the same tip).
    # Gating on workflow_run.conclusion was actively harmful: GitHub keeps only
    # ONE pending run per concurrency group, so a skipped-on-arrival deploy could
    # evict a genuine pending push deploy and silently drop a merge from
    # production. Publishing an extra time costs a build; losing a deploy costs
    # correctness.
    steps:
      # Always publish the current tip of main, whatever triggered us — so the
      # live Worker is the latest build regardless of who pushed.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is not set." \
                 "Add it (and CLOUDFLARE_ACCOUNT_ID) under Settings → Secrets" \
                 "and variables → Actions, then re-run this workflow."
            exit 1
          fi
      - run: npm ci
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
      - name: Sync MUNS_ACCESS_TOKEN to the Worker
        # /api/stock-search (Search Stocks) calls the Muns company-search API with
        # this bearer token, read from the Worker's env. The token can live either
        # as a Cloudflare Worker secret (set once in the dashboard) or as a repo
        # secret — this step covers the second case so the two don't drift. It is
        # a no-op when the repo secret is unset, leaving whatever the Worker
        # already has untouched. (`secrets` isn't usable in a step `if:`, hence
        # the guard inside the script.)
        env:
          MUNS_ACCESS_TOKEN: ${{ secrets.MUNS_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$MUNS_ACCESS_TOKEN" ]; then
            echo "MUNS_ACCESS_TOKEN repo secret not set — leaving the Worker's own value in place."
            exit 0
          fi
          printf '%s' "$MUNS_ACCESS_TOKEN" | npx wrangler secret put MUNS_ACCESS_TOKEN
      - name: Report the Worker's secrets
        # Names only (never values). Confirms the deploy didn't drop a secret set
        # in the dashboard — the failure that left /api/stock-search answering
        # "no-token" while the dashboard showed MUNS_ACCESS_TOKEN as encrypted.
        # Never fails the deploy: it is a signal, not a gate.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Which account/Worker this deploy actually targets. Needed because a
          # secret added to the wrong Worker (or a different Cloudflare account)
          # looks perfectly set in the dashboard while the deployed code sees
          # nothing — `secret list` returning [] is what that looks like here.
          echo "--- wrangler whoami (secret values are masked by Actions) ---"
          npx wrangler whoami || true
          echo "--- secrets bound to the Worker named in wrangler.jsonc ---"
          npx wrangler secret list > secrets.json 2>&1 || true
          cat secrets.json
          if grep -q MUNS_ACCESS_TOKEN secrets.json; then
            echo "::notice::MUNS_ACCESS_TOKEN is bound to the Worker."
          else
            echo "::warning::MUNS_ACCESS_TOKEN is NOT bound to this Worker — /api/stock-search will answer 503 no-token."
          fi
