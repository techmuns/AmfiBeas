name: Broking active clients (NSE probe / fetch)

# Automated-fetch tooling for the Broking tab's NSE "active clients per member
# (broker)" data — kept as a MANUAL, dispatch-only workflow because a full
# investigation (Sep 2026) found NSE does not currently expose this dataset
# through a free, machine-readable endpoint. What that investigation established:
#
#   • Headless Chromium (Playwright) is blocked from GitHub-runner IPs at NSE's
#     Akamai edge — HTTP/2 reset, then HTTP/1.1 hang. So the browser approach
#     cannot fetch NSE from CI.
#   • curl_cffi (real-Chrome TLS/JA3 impersonation) DOES reach NSE's API from the
#     same runners — homepage, /all-reports and /api/* return 200. The block is a
#     fingerprint block, and curl_cffi beats it. (Proven by the probe step below;
#     reusable for any other NSE data we want automated.)
#   • BUT NSE's discoverable report API (/api/merged-daily-reports) is daily-only
#     (bhavcopies etc.); per-broker active clients is not in it, nor in the
#     /all-reports catalog. That statistic lives in NSE's monthly Market Pulse
#     PDF / member portal, not a free structured feed.
#
# So the Broking tab is refreshed by the MANUAL monthly CSV drop (see
# manual-data/broking/README.md) — ~2 min/month, then it auto-deploys. This
# workflow stays for two reasons: (1) `mode: probe` re-runs the curl_cffi
# discovery if NSE ever exposes an endpoint (pin it in NSE_ACTIVE_CLIENTS_URL and
# flip `mode: full` back on with a schedule); (2) it documents the finding.
#
# Safety: any failed/blocked fetch exits non-zero and the commit step is skipped,
# so a degraded run can never overwrite good data.

on:
  # Dispatch-only: no monthly schedule, because there is no working auto-fetch
  # endpoint yet (see the header). Refresh via the manual CSV drop instead.
  workflow_dispatch:
    inputs:
      mode:
        description: "probe = re-run curl_cffi NSE discovery (no writes); full = fetch + write (needs a working NSE_ACTIVE_CLIENTS_URL)"
        required: false
        default: "probe"
        type: choice
        options:
          - "probe"
          - "full"
      endpoint:
        description: "Override NSE_ACTIVE_CLIENTS_URL for this run (blank = use the repo variable)"
        required: false
        default: ""
        type: string
      month:
        description: "Force the output month as YYYY-MM (blank = prior month)"
        required: false
        default: ""
        type: string
      commit:
        description: "Commit the refreshed data? (false = run only)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

concurrency:
  group: broking-active-clients-${{ github.ref }}
  cancel-in-progress: false

jobs:
  broking:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        # NSE is session-gated (Akamai), so the scraper drives a real browser.
        run: npx playwright install --with-deps chromium

      - name: NSE reachability probe (curl_cffi TLS impersonation)
        # Probe mode only. Decides whether NSE's block is fingerprint-level
        # (curl_cffi's real-Chrome TLS/JA3 gets 200s → beatable) or an IP-level
        # block of GitHub's runners (everything fails → no free fetch works).
        if: ${{ inputs.mode == 'probe' }}
        continue-on-error: true
        run: |
          python3 -m pip install --quiet "curl_cffi>=0.7"
          python3 scripts/ingest/broking_curl_probe.py

      - name: Refresh NSE active clients
        # Skipped in probe mode: NSE blocks headless Chromium (proven), so probe
        # mode now relies on the curl_cffi step above. Full/scheduled runs still
        # go through here until the fetcher is ported to curl_cffi.
        if: ${{ inputs.mode != 'probe' }}
        env:
          BROKING_MODE: ${{ inputs.mode || 'full' }}
          # Manual override wins; otherwise the pinned repo variable (empty until
          # the first probe run confirms the endpoint).
          NSE_ACTIVE_CLIENTS_URL: ${{ inputs.endpoint != '' && inputs.endpoint || vars.NSE_ACTIVE_CLIENTS_URL }}
          BROKING_MONTH: ${{ inputs.month }}
        run: npm run ingest:broking

      - name: Upload probe capture
        if: ${{ always() && inputs.mode == 'probe' }}
        uses: actions/upload-artifact@v4
        with:
          name: broking-probe
          path: data/debug/broking-probe*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Rebuild broking snapshot
        # Only after a successful full fetch (keep-last-good non-zero exit skips
        # this). Regenerates src/data/snapshots/broking.json from the new CSV.
        if: ${{ success() && (inputs.mode || 'full') != 'probe' }}
        run: npm run build:broking

      - name: Commit refreshed broking data
        # Scheduled runs always commit; manual runs honour the toggle and never
        # commit in probe mode. Runs only when the fetch + rebuild SUCCEEDED.
        if: ${{ success() && (github.event_name == 'schedule' || (inputs.mode == 'full' && inputs.commit == 'true')) }}
        run: |
          git add manual-data/broking src/data/snapshots/broking.json
          if git diff --cached --quiet; then
            echo "No broking changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh NSE broking active clients ($(date -u +%Y-%m-%d))"
          bash scripts/ci/push-with-rebase.sh
