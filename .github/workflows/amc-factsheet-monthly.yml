name: AMC monthly portfolio fetch
run-name: "AMC holdings · ${{ github.event.schedule == '7 7 9-12 * *' && 'scheme-benchmarks' || inputs.mode || 'monthly' }}"

# One shared collector for AmfiBeas and downstream readers. Raw disclosures and
# their verified manifest publish before derived dashboards or optional benchmarks.
on:
  push:
    branches: [main]
    paths:
      - scripts/ingest/amc-factsheets/**
      - .github/workflows/amc-factsheet-monthly.yml
  schedule:
    - cron: "3,18,33,48 * * * *"
    - cron: "7 7 9-12 * *" # Preserve the monthly benchmark-refresh window.
  workflow_dispatch:
    inputs:
      amcs:
        description: "Optional comma-separated AMC slugs; all other saved sources remain retained."
        required: false
        type: string
      commit:
        description: "Set false for a local/staging-style collection without publishing data."
        default: "true"
        type: string
      mode:
        description: "Holdings modes recover available history using saved checkpoints."
        default: monthly
        type: choice
        options: [monthly, backfill, scheme-benchmarks]
permissions:
  contents: write
concurrency:
  group: amc-monthly-fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      MODE: ${{ github.event.schedule == '7 7 9-12 * *' && 'scheme-benchmarks' || inputs.mode || 'monthly' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install the standard browser for HSBC's public catalogue
        if: env.MODE != 'scheme-benchmarks'
        run: npx playwright install --with-deps chromium
      - name: Collect shared AMC disclosures
        id: capture
        if: env.MODE != 'scheme-benchmarks'
        continue-on-error: true
        env:
          AMC_ONLY: ${{ inputs.amcs }}
        run: timeout 35m npm run collect:holdings
      - name: Finalize retained source manifest
        id: manifest
        if: always() && steps.capture.outcome != 'skipped'
        env:
          AMC_CAPTURE_INTERRUPTED: ${{ steps.capture.outcome != 'success' }}
        run: node scripts/ingest/amc-factsheets/shared/manifest.mjs
      - name: Publish source snapshots and continuation checkpoints
        if: always() && steps.manifest.outcome == 'success' && inputs.commit != 'false'
        run: |
          if [ -z "$(git status --porcelain public/amc-holdings)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/amc-holdings
          git commit -m "chore(data): publish verified AMC disclosure snapshots"
          bash scripts/ci/push-with-rebase.sh "${{ github.ref_name }}"
      - name: Rebuild holdings views from the shared snapshots
        if: steps.manifest.outcome == 'success'
        run: |
          npm run build:amc-direct
          npm run build:cap-flows
          npm run build:sector-gross
          npm run build:insights-plus
          npm run build:stocks
      - name: Publish derived holdings views
        if: steps.manifest.outcome == 'success' && inputs.commit != 'false'
        run: |
          PATHS="public/amc-portfolio public/holdings-direct public/stocks src/data/portfolio-tracker/amc-portfolio-crosswalk.json src/data/portfolio-tracker/amc-direct-index.json src/data/portfolio-tracker/cap-flows.json src/data/portfolio-tracker/sector-gross-flows.json src/data/portfolio-tracker/insights-plus.json"
          if [ -z "$(git status --porcelain $PATHS)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $PATHS
          git commit -m "chore(data): rebuild views from shared AMC disclosures"
          bash scripts/ci/push-with-rebase.sh "${{ github.ref_name }}"
      - name: Refresh official scheme benchmarks
        if: env.MODE == 'scheme-benchmarks'
        env:
          AMC_ONLY: ${{ inputs.amcs }}
        run: |
          npx playwright install --with-deps chromium
          npm run build:scheme-benchmarks
          npm run validate:scheme-benchmarks
          npm run test:scheme-benchmarks
      - name: Publish official scheme benchmarks
        if: env.MODE == 'scheme-benchmarks' && inputs.commit != 'false'
        run: |
          PATHS="public/nav-data/mf-scheme-benchmarks.json public/nav-data/mf-scheme-benchmark-coverage.json"
          if [ -z "$(git status --porcelain $PATHS)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $PATHS
          git commit -m "chore(data): refresh official scheme benchmarks"
          bash scripts/ci/push-with-rebase.sh "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amc-source-coverage
          path: |
            public/amc-holdings/coverage.json
            public/amc-holdings/coverage-checks.json
            public/amc-holdings/directory.json
            public/nav-data/mf-scheme-benchmark-coverage.json
          retention-days: 30
          if-no-files-found: warn
      - name: Report incomplete source coverage after publication
        if: always() && steps.manifest.outcome == 'success'
        run: node -e 'const m=require("./public/amc-holdings/coverage.json");console.log(m.coverage);if(m.coverage.status!=="current"||m.state!=="complete")process.exitCode=1;'
